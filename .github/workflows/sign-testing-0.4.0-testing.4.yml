name: Sign Testing SDK 0.4.0-testing.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    if: github.repository == 'OpenCow42/swiftps2lchains' && github.ref == 'refs/heads/codex/testing-sdk-0.4.0-testing.4'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Sign the fixed Testing release documents
        env:
          SWIFTPS2_RELEASE_PRIVATE_KEY_BASE64: ${{ secrets.SWIFTPS2_TESTING_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SWIFTPS2_RELEASE_PRIVATE_KEY_BASE64"
          test "$GITHUB_REF" = 'refs/heads/codex/testing-sdk-0.4.0-testing.4'
          manifest='release-staging/0.4.0-testing.4/release-manifest.json'
          channel='channels/testing.json'
          test "$(jq -r '.releaseVersion' "$manifest")" = '0.4.0-testing.4'
          test "$(jq -r '.channel' "$manifest")" = testing
          test "$(jq -r '.signingKeyID' "$manifest")" = swiftps2-testing-1
          test "$(jq -r '.release.version' "$channel")" = '0.4.0-testing.4'
          test "$(jq -r '.signingKeyID' "$channel")" = swiftps2-testing-1
          cat > "$RUNNER_TEMP/sign.swift" <<'SWIFT'
          import CryptoKit
          import Foundation

          let environment = ProcessInfo.processInfo.environment
          guard let encodedPrivateKey = environment["SWIFTPS2_RELEASE_PRIVATE_KEY_BASE64"],
                let privateData = Data(base64Encoded: encodedPrivateKey),
                let publicData = Data(base64Encoded: "zOtioeUFcnCnTFY38C8xsYaihK41D4ISdzUPkSESDg0=") else {
              throw CocoaError(.fileReadCorruptFile)
          }
          let privateKey = try Curve25519.Signing.PrivateKey(rawRepresentation: privateData)
          let publicKey = try Curve25519.Signing.PublicKey(rawRepresentation: publicData)
          for (input, output) in [
              ("release-staging/0.4.0-testing.4/release-manifest.json", "release-staging/0.4.0-testing.4/release-manifest.sig"),
              ("channels/testing.json", "channels/testing.json.sig"),
          ] {
              let document = try Data(contentsOf: URL(fileURLWithPath: input))
              let signature = try privateKey.signature(for: document)
              guard publicKey.isValidSignature(signature, for: document) else {
                  throw CocoaError(.fileWriteUnknown)
              }
              try (signature.base64EncodedString() + "\n").write(toFile: output, atomically: true, encoding: .utf8)
          }
          SWIFT
          swift "$RUNNER_TEMP/sign.swift"
          node scripts/verify-channel-signatures.mjs
          git diff --check
          git config user.name 'swiftps2-testing-release[bot]'
          git config user.email 'swiftps2-testing-release[bot]@users.noreply.github.com'
          git add "$manifest" release-staging/0.4.0-testing.4/release-manifest.sig "$channel" channels/testing.json.sig
          git commit -m 'chore(testing): sign SDK 0.4.0-testing.4 metadata'
          git push
