name: Validate channel metadata

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate empty or complete channel pointers
        run: |
          for channel in stable preview testing; do
            jq -e --arg channel "$channel" '
              .schemaVersion == 1 and
              .channel == $channel and
              (.signingKeyID | length > 0) and
              (.release == null or (
                (.release.version | length > 0) and
                (.release.manifestURL | startswith("https://")) and
                (.release.manifestSignatureURL | startswith("https://")) and
                (.release.manifestSHA256 | test("^[0-9a-f]{64}$"))
              ))
            ' "channels/$channel.json"
          done
          jq -e '.properties.channel.enum == ["stable", "preview", "testing"]' \
            schemas/channel-v1.schema.json
          jq -e '.properties.schemaVersion.const == 2' schemas/release-manifest-v2.schema.json
      - name: Verify pinned detached Ed25519 signatures
        run: node scripts/verify-channel-signatures.mjs

  public-demo:
    # The published suite currently contains Apple Silicon host tools only;
    # fail before downloading if GitHub changes this label's architecture.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check the public demo command
        run: |
          test "$(uname -m)" = arm64
          ./scripts/swiftps2-demo --help
          xcrun swift tests/test-swiftps2-demo.swift
      - name: Prepare a home-independent public checkout
        run: |
          ci_checkout="/tmp/swiftps2lchains-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ci_checkout"
          git archive HEAD | tar -x -C "$ci_checkout"
          echo "SWIFTPS2_CI_CHECKOUT=$ci_checkout" >> "$GITHUB_ENV"
      - name: Build with the published compiler suite
        run: |
          cd "$SWIFTPS2_CI_CHECKOUT"
          ./scripts/swiftps2-demo
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp artifacts/moving-colors.elf artifacts/moving-colors.elf.manifest.json \
            "$GITHUB_WORKSPACE/artifacts/"
      - name: Verify the published R5900 ELF
        run: |
          test -f artifacts/moving-colors.elf
          test -f artifacts/moving-colors.elf.manifest.json
          expected=$(jq -r '.elf.sha256' artifacts/moving-colors.elf.manifest.json)
          actual=$(shasum -a 256 artifacts/moving-colors.elf | awk '{print $1}')
          test "$actual" = "$expected"
          file artifacts/moving-colors.elf | grep -q 'ELF 32-bit LSB executable, MIPS'
          jq -e '
            .schemaVersion == 1 and
            .compilerSuite.qualification == "candidate-unqualified" and
            .target == {
              "abi": "n32",
              "cpu": "r5900",
              "elfClass": "ELF32",
              "triple": "mips64el-scei-ps2"
            }
          ' artifacts/moving-colors.elf.manifest.json
